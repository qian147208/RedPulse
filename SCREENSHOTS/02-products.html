<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵芯 - 产品库</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
            background: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .phone-frame {
            width: 393px;
            height: 852px;
            background: #fafafa;
            border-radius: 47px;
            border: 3px solid #1a1a1a;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .status-bar {
            height: 54px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 30px 8px;
            font-size: 14px;
            font-weight: 600;
            color: #000;
        }
        .content {
            padding: 0 16px;
            height: calc(852px - 54px - 44px - 83px);
            overflow: hidden;
            padding-top: 8px;
        }
        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            padding: 0 16px 4px;
        }
        .search-bar {
            margin: 8px 16px 12px;
            height: 36px;
            border-radius: 12px;
            background: white;
            border: 0.5px solid rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 6px;
        }
        .search-bar .icon { color: #999; font-size: 14px; }
        .search-bar .text { font-size: 14px; color: #999; }
        
        .product-list {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .product-card {
            background: white;
            border-radius: 16px;
            padding: 14px;
            display: flex;
            gap: 12px;
            border: 0.5px solid rgba(0,0,0,0.06);
        }
        .product-thumb {
            width: 72px;
            height: 72px;
            border-radius: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        .product-thumb.skin { background: linear-gradient(135deg, #ffecd2, #fcb69f); }
        .product-thumb.makeup { background: linear-gradient(135deg, #fbc2eb, #a6c1ee); }
        .product-thumb.food { background: linear-gradient(135deg, #a1c4fd, #c2e9fb); }
        .product-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }
        .product-name {
            font-size: 15px;
            font-weight: 600;
            color: #1a1a1a;
        }
        .product-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .product-tag {
            padding: 2px 8px;
            border-radius: 8px;
            background: #f5f5f7;
            font-size: 11px;
            color: #666;
        }
        .product-tag.highlight {
            background: #FFF0F2;
            color: #FF2442;
        }
        .product-sell-point {
            font-size: 12px;
            color: #888;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 83px;
            background: rgba(250,250,250,0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            border-top: 0.5px solid rgba(0,0,0,0.08);
        }
        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            font-size: 10px;
            color: #999;
        }
        .tab-item.active {
            color: #FF2442;
        }
        .tab-icon {
            font-size: 20px;
        }
        .fab {
            position: absolute;
            right: 20px;
            bottom: 100px;
            width: 52px;
            height: 52px;
            border-radius: 26px;
            background: #FF2442;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 16px rgba(255,36,66,0.4);
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="status-bar">
            <span>9:41</span>
            <span>📶 🔋</span>
        </div>
        
        <div class="page-title">产品库</div>
        
        <div class="search-bar">
            <span class="icon">🔍</span>
            <span class="text">搜索产品、卖点、场景...</span>
        </div>
        
        <div class="product-list">
            <div class="product-card">
                <div class="product-thumb skin">🧴</div>
                <div class="product-info">
                    <div class="product-name">烟酰胺精华液</div>
                    <div class="product-tags">
                        <div class="product-tag highlight">护肤</div>
                        <div class="product-tag">25-35岁</div>
                        <div class="product-tag">熬夜急救</div>
                    </div>
                    <div class="product-sell-point">提亮肤色、淡化痘印、温和不刺激</div>
                </div>
            </div>
            
            <div class="product-card">
                <div class="product-thumb makeup">💄</div>
                <div class="product-info">
                    <div class="product-name">哑光唇膏 #302</div>
                    <div class="product-tags">
                        <div class="product-tag highlight">彩妆</div>
                        <div class="product-tag">18-30岁</div>
                        <div class="product-tag">日常通勤</div>
                    </div>
                    <div class="product-sell-point">高级哑光质地、持久不脱色、显白</div>
                </div>
            </div>
            
            <div class="product-card">
                <div class="product-thumb food">🍵</div>
                <div class="product-info">
                    <div class="product-name">胶原蛋白饮品</div>
                    <div class="product-tags">
                        <div class="product-tag highlight">内服</div>
                        <div class="product-tag">25-40岁</div>
                        <div class="product-tag">抗衰</div>
                    </div>
                    <div class="product-sell-point">口服美容、补充胶原蛋白、改善肤质</div>
                </div>
            </div>
        </div>
        
        <div class="fab">+</div>
        
        <div class="tab-bar">
            <div class="tab-item">
                <div class="tab-icon">✨</div>
                <span>生成</span>
            </div>
            <div class="tab-item active">
                <div class="tab-icon">📦</div>
                <span>产品库</span>
            </div>
            <div class="tab-item">
                <div class="tab-icon">📖</div>
                <span>历史</span>
            </div>
            <div class="tab-item">
                <div class="tab-icon">👤</div>
                <span>我的</span>
            </div>
        </div>
    </div>
</body>
</html>
